plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.edgelight'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.edgelight"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "7.0"
    }

    signingConfigs {
        release {
            storeFile file("edgelight.jks")
            storePassword "123456"
            keyAlias "edgelight"
            keyPassword "123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
}
